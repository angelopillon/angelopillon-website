<div class="glass panel" id="camelot">
  <div class="two-col" style="align-items:start">
    <svg class="wheel" viewBox="0 0 520 520" data-wheel role="group" aria-label="Camelot wheel"></svg>
    <div>
      <label class="gfield"><span>{{ L.pick }}</span><select data-key></select></label>
      <table class="vtable" style="margin-top:20px"><thead><tr><th>{{ L.th_code }}</th><th>{{ L.th_key }}</th><th>{{ L.th_move }}</th></tr></thead><tbody data-list></tbody></table>
    </div>
  </div>
</div>
