<header class="page-head wrap">
  <ol class="crumbs" aria-label="{{ ui.crumbs_label }}"><li><a href="{{ ui.home }}">{{ ui.home_label }}</a></li><li><span aria-current="page">{{ p.crumb }}</span></li></ol>
  <h1 class="t-h1">{{ p.h1 }}</h1>
  {% if p.lead %}<p class="t-lead">{{ p.lead }}</p>{% endif %}
</header>
<section class="wrap legal" style="padding-bottom:var(--sec)">
  <div class="prose" style="max-width:var(--measure)">{{ p.body }}</div>
</section>
