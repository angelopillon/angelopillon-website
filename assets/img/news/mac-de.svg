<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img"><title>MacBook Pro: die zwei Wege im November</title><rect x="0" y="0" width="960" height="540" rx="18" fill="#0C0C12"/><text x="48" y="64" font-size="30" font-weight="750" fill="#F5F5F7" text-anchor="start">MacBook Pro: die zwei Wege im November</text><text x="48" y="98" font-size="18" font-weight="450" fill="#A1A1AA" text-anchor="start">US-Einstiegspreise der 14-Zoll-Modelle</text><text x="48" y="190" font-size="20" font-weight="700" fill="#F5F5F7" text-anchor="start">M6</text><rect x="240" y="166" width="248" height="38" rx="8" fill="#A3E635"/><text x="502" y="193" font-size="20" font-weight="700" fill="#F5F5F7" text-anchor="start">$1,999</text><text x="240" y="232" font-size="16" font-weight="500" fill="#A1A1AA" text-anchor="start">16–32 GB, 3× Thunderbolt 4, Mini-LED</text><text x="48" y="294" font-size="20" font-weight="700" fill="#F5F5F7" text-anchor="start">M5 Pro touch</text><rect x="240" y="270" width="360" height="38" rx="8" fill="#7CF2DC"/><text x="614" y="297" font-size="20" font-weight="700" fill="#F5F5F7" text-anchor="start">$2,899</text><text x="240" y="336" font-size="16" font-weight="500" fill="#A1A1AA" text-anchor="start">OLED-Touchscreen, ab 24 GB</text><text x="48" y="398" font-size="20" font-weight="700" fill="#F5F5F7" text-anchor="start">M5 Max touch</text><rect x="240" y="374" width="560" height="38" rx="8" fill="#8B4DFF"/><text x="814" y="401" font-size="20" font-weight="700" fill="#F5F5F7" text-anchor="start">$4,499</text><text x="240" y="440" font-size="16" font-weight="500" fill="#A1A1AA" text-anchor="start">OLED-Touchscreen</text><text x="48" y="514" font-size="13" font-weight="450" fill="#808089" text-anchor="start">Quelle: Apple. Auslieferung ab 6. November 2026</text><text x="912" y="514" font-size="13" font-weight="600" fill="#808089" text-anchor="end">angelopillon.com</text></sv